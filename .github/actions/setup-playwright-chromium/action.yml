name: "Setup Browser Action"
description: "A GitHub Action to setup Node.js, yarn environment, and chromium browser for testing."

runs:
  using: "composite"
  steps:
    - name: Cache Fonts
      uses: actions/cache@v4
      id: font-cache
      with:
        path: /usr/share/fonts/opentype/noto
        key: ${{ runner.os }}-fonts-
        restore-keys: |
          ${{ runner.os }}-fonts-

    - name: Install Japanese Fonts
      if: steps.font-cache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
      shell: bash

    - name: Browser Cache
      id: browser-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-chromium-

    - name: Install Playwright chromium browser
      if: steps.browser-cache.outputs.cache-hit != 'true'
      run: npx playwright install chromium --with-deps
      shell: bash
